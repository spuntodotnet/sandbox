# sandbox.spunto.net: the docs site (Next static export, out/) and the installer, on 8080.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # `curl -fsSL https://sandbox.spunto.net/install.sh | sudo sh` — the repository's install.sh, as is.
  location = /install.sh { default_type text/x-shellscript; add_header Cache-Control "no-cache"; }

  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri.html $uri/index.html =404; }
  error_page 404 /404.html;
}
