# Weekly, one PR per ecosystem and kind of bump: the actions pinned by SHA (the tag in their comment
# follows), the package's npm dependencies, the docs site's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
