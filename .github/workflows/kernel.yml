name: Guest kernel

# The microVMs' kernel (kernel/), built reproducibly: every build must give exactly the sha256 of
# kernel/vmlinux.sha256 — what the engine pins and checks (GUEST_KERNEL). On main, published on
# ghcr.io as an OCI blob addressed by that sha256: the public package spuntodotnet/spunto-fc-kernel,
# this repository's own (its GITHUB_TOKEN may write it; coderhammer/spunto-fc-kernel, the first one,
# refused it — kept as it is, the engine falls back on it).

on:
  push:
    branches: [main]
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:

jobs:
  build:
    name: Build (reproducible) & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Build
        run: kernel/build.sh "$RUNNER_TEMP/out"

      - name: Same bytes as the pinned sha256
        run: |
          cd "$RUNNER_TEMP/out"
          cat vmlinux.sha256
          if ! diff -u "$GITHUB_WORKSPACE/kernel/vmlinux.sha256" vmlinux.sha256; then
            echo "::error::the kernel built here is not the pinned one — a config change needs a new SPUNTO_REVISION and vmlinux.sha256 (and GUEST_KERNEL in src/engine/config.ts), or the build is not reproducible"
            exit 1
          fi

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        if: github.event_name != 'pull_request'

      - name: Publish to ghcr.io
        if: github.event_name != 'pull_request'
        # The token through the environment, not spliced into the script by the expression.
        env: { REGISTRY_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          . kernel/VERSION
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd "$RUNNER_TEMP/out"
          # The vmlinux as is: its blob digest is its sha256, the one the daemon fetches and checks.
          oras push "ghcr.io/spuntodotnet/spunto-fc-kernel:${LINUX_VERSION}-${SPUNTO_REVISION}" \
            --artifact-type application/vnd.spunto.fc-kernel \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            vmlinux:application/vnd.spunto.fc-kernel.vmlinux \
            config:text/plain
